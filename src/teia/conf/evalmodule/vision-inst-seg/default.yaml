defaults:
  - /evalmodule/_shared/run@_here_
  - /node/eval/metric@match: instance_match
  - /node/eval/kernel@match.similarity: iou_mask
  - /node/eval/metric@ap: ranked_average_precision
  - /node/eval/metric@match_stream_box: instance_match
  - /node/eval/kernel@match_stream_box.similarity: iou_xyxy
  - /node/eval/metric@ap_stream_box: ranked_average_precision
  - /node/eval/view@per_class_ap_bar: ranked_bar
  - /node/eval/view@pr_curves_view: multi_curve_bundle
  - /node/eval/view@per_class_ap_table: table
  - _self_

ctx:
  conf: 0.001
  iou: 0.7
  max_det: 300
  lowres_polygons: true
match:
  in: [capture.det.polys, capture.det.category, capture.det.score, capture.det.sample_idx, batch.polys, batch.cls, batch.batch_idx]
  out: eval.inst_seg.matched
  pred:
    geometry: capture.det.polys
    category: capture.det.category
    score: capture.det.score
    index: capture.det.sample_idx
  gt:
    geometry: batch.polys
    category: batch.cls
    index: batch.batch_idx
ap:
  in: [eval.inst_seg.matched]
  out: eval.inst_seg.ap
match_stream_box:
  in: [capture.det.boxes, capture.det.category, capture.det.score, capture.det.sample_idx, batch.bboxes, batch.cls, batch.batch_idx]
  out: eval.inst_seg.matched_stream_box
  pred:
    geometry: capture.det.boxes
    category: capture.det.category
    score: capture.det.score
    index: capture.det.sample_idx
  gt:
    geometry: batch.bboxes
    category: batch.cls
    index: batch.batch_idx
ap_stream_box:
  is_fitness: true
  in:
    matched: eval.inst_seg.matched_stream_box
  out: eval.inst_seg.ap_stream_box
  monitor: true
summary:
  _target_: teia.node.eval.view.summary.Summary
  in: [eval.inst_seg.ap]
per_class_ap_bar:
  title: Per-Class Average Precision
  sort: true
  xlabel: Average Precision
  bounded_x: true
  filename: per_class_average_precision_bar_sorted.png
  in:
    labels: eval.inst_seg.ap:per_category[].category
    values: eval.inst_seg.ap:per_category[].average_precision
pr_curves_view:
  title: PR Curves per Class
  x_label: Recall
  y_label: Precision
  filename: pr_curves_per_class.png
  in:
    curves: eval.inst_seg.ap:pr_curves
per_class_ap_table:
  title: Per-Class Average Precision
  filename: per_class_average_precision.csv
  in:
    rows: eval.inst_seg.ap:per_category
