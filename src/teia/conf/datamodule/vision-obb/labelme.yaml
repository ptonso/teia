defaults:
  - /node/data/reader@jsons: files_reader_json
  - /node/data/transform@parse: parse_labelme
  - /node/data/transform@cls_enc: name_list_encode
  - /node/data/transform@decode: decode_image
  - /node/data/transform@letterbox: letterbox_seg
  - /node/data/transform@obb: obb_from_polys
  - /node/data/transform@normalize: normalize_image
  - /node/data/collate@col_image: stack_images
  - /node/data/collate@col_boxes: concat_boxes_5
  - /node/data/collate@col_cls: concat_classes
  - /node/data/collate@col_batch_idx: batch_index
  - /node/data/collate@col_ori_shape: list_field
  - /node/data/collate@col_ratio_pad: list_field
  - /node/data/collate@col_path: list_field
  - _self_

jsons:
  out: item.json_path
parse:
  in: item.json_path
  out: [item.img_path, item.boxes, item.poly_labels, item.polys]
  phase: target
cls_enc:
  in: item.poly_labels
  out: item.box_cls
  phase: target
decode:
  in: item.img_path
  out: item.image
letterbox:
  in: [item.image, item.boxes, item.polys]
  out: [item.image, item.boxes, item.polys, item.ratio_pad, item.ori_shape]
obb:
  in: item.polys
  out: item.obb
normalize:
  pixel_norm: unit
  in: batch.image
  out: batch.image
  stage: batch
col_image:
  in: item.image
  out: batch.image
  stage: batch
col_boxes:
  in: item.obb
  out: batch.bboxes
  stage: batch
col_cls:
  in: item.box_cls
  out: batch.cls
  stage: batch
col_batch_idx:
  in: item.obb
  out: batch.batch_idx
  stage: batch
col_ori_shape:
  in: item.ori_shape
  out: batch.ori_shape
  stage: batch
col_ratio_pad:
  in: item.ratio_pad
  out: batch.ratio_pad
  stage: batch
col_path:
  in: item.img_path
  out: batch.path
  stage: batch
batch_size: 64
image_size: ${netmodule.input.image_size}
