# LabelMe JSON + edges key. Formats: teia.node.data.reader.labelme, teia.node.data.reader.extension.labelme_graph
defaults:
  - /node/data/reader@boards: labelme
  - /node/data/reader/extension@boards.extension: labelme_graph
  - /node/data/transform@adjacency: edge_adjacency
  - /node/data/transform@decode: decode_image
  - /node/data/transform@enc: name_list_encode
  - /node/data/transform@crop: crop_nodes
  - /node/data/transform@box: node_boxes
  - /node/data/transform@normalize: normalize_image
  - /node/data/collate@col_node_image: stack_node_images
  - /node/data/collate@col_node_box: pad_node_boxes
  - /node/data/collate@col_adj: pad_adjacency
  - /node/data/collate@col_mask: node_mask
  - /node/data/collate@col_cls: flat_node_classes
  - /node/data/collate@col_batch_idx: node_batch_index
  - _self_

boards:
  root: labelme
  out: [item.image_path, item.boxes, item.labels, item.edges]
adjacency:
  in: [item.edges, item.boxes]
  out: item.adj
  phase: target
decode:
  in: item.image_path
  out: item.image
enc:
  in: item.labels
  out: item.cls
  phase: target
crop:
  in: [item.image, item.boxes]
  out: item.node_image
  phase: target
box:
  in: [item.image, item.boxes]
  out: item.node_box
  phase: target
normalize:
  in: batch.node_image
  out: batch.node_image
  stage: batch
col_node_image:
  in: item.node_image
  out: batch.node_image
  stage: batch
col_node_box:
  in: item.node_box
  out: batch.node_box
  stage: batch
col_adj:
  in: item.adj
  out: batch.adj
  stage: batch
col_mask:
  in: item.node_box
  out: batch.node_mask
  stage: batch
col_cls:
  in: item.cls
  out: batch.cls
  stage: batch
col_batch_idx:
  in: item.node_box
  out: batch.batch_idx
  stage: batch
batch_size: 4
