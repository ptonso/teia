defaults:
  - /node/data/reader@auds: audio_folder_reader
  - /node/data/transform@enc: encode_labels
  - /node/data/transform@decode: decode_audio
  - /node/data/transform@mel: mel_spectrogram
  - /node/data/collate@col_audio: stack
  - /node/data/collate@col_cls: class_labels
  - _self_

auds:
  out: [item.audio_path, item.label_name]
enc:
  in: item.label_name
  out: item.cls
  phase: target
decode:
  in: item.audio_path
  out: item.waveform
mel:
  in: item.waveform
  out: item.audio
col_audio:
  in: item.audio
  out: batch.audio
  stage: batch
col_cls:
  in: item.cls
  out: batch.cls
  stage: batch
batch_size: 32
