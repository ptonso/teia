[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyteia"
version = "0.0.1"
description = "A Hydra-configured deep-learning runtime: data, network and evaluation graphs declared in config and run by a thin Lightning engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pedro Tonso" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["deep-learning", "pytorch", "lightning", "hydra", "config", "machine-learning", "onnx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "PyYAML>=6.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "lightning>=2.4",
  "torch>=2.3",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "pandas>=2.0",
  "scikit-learn",
  "onnx>=1.16",
  "onnxscript",
  "onnxruntime>=1.18",
  "rich>=15.0",
]

[project.optional-dependencies]
vision = ["torchvision"]
audio = ["torchaudio", "soundfile"]
tabular = ["sqlalchemy", "pyarrow"]
all = ["pyteia[vision,audio,tabular]"]

[project.urls]
Homepage = "https://github.com/ptonso/teia"
Issues = "https://github.com/ptonso/teia/issues"

[project.scripts]
teia = "teia.core.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["teia*", "hydra_plugins*"]
exclude = ["teia.skills.*.logs"]

[tool.setuptools.package-data]
"*" = ["**/*.yaml"]
"teia" = ["skills/*/*.md"]
